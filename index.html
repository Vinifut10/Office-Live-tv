<style>
:root{
  --bg:#f7f5ff;--card:#fff;--text:#27233a;--muted:#7c7892;--primary:#6d4aff;--primary2:#9c73ff;
  --green:#26b873;--yellow:#ffbd3b;--red:#ee5b69;--line:#ebe7f6;--shadow:0 12px 35px rgba(66,48,130,.12);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#eee9ff 0,#f9f7ff 42%,#fff 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{width:min(760px,100%);margin:auto;min-height:100vh;padding:18px 16px 100px}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(460px,100%);background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow);border-radius:30px;padding:28px}
.logo-bubble{width:96px;height:96px;margin:-4px auto 12px;border-radius:28px;display:grid;place-items:center;font-size:54px;background:linear-gradient(145deg,#7650ff,#b585ff);box-shadow:0 14px 30px rgba(109,74,255,.3);transform:rotate(-4deg)}
h1,h2,h3,p{margin-top:0}.login h1{text-align:center;margin-bottom:8px;font-size:31px}.login .subtitle{text-align:center;color:var(--muted);line-height:1.45;margin-bottom:22px}
.role-switch{display:grid;grid-template-columns:1fr 1fr;background:#f0edfa;padding:5px;border-radius:16px;margin-bottom:16px}
.role-switch button{border:0;background:transparent;padding:11px;border-radius:12px;font-weight:800;color:var(--muted)}
.role-switch button.active{background:#fff;color:var(--primary);box-shadow:0 3px 12px rgba(71,50,130,.1)}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:800;color:#5e5873}
.field input,.field textarea,.field select{width:100%;border:1.5px solid #ded8ef;border-radius:15px;padding:13px 14px;background:#fff;outline:none;color:var(--text)}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(109,74,255,.1)}
.primary{width:100%;border:0;border-radius:17px;padding:14px 18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(109,74,255,.28)}
.secondary{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;color:var(--text);font-weight:800}
.danger{border:0;border-radius:14px;padding:10px 14px;background:#fff0f2;color:#c63b4a;font-weight:800}
.error{margin:12px 0 0;padding:11px 12px;border-radius:12px;background:#fff1f3;color:#b83245;font-size:14px;font-weight:700;display:none}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 16px}
.userline{display:flex;align-items:center;gap:11px}.avatar{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#fff5c7,#ffd86f);box-shadow:0 8px 18px rgba(145,107,10,.14)}
.header h1{font-size:24px;margin:0}.small{font-size:13px;color:var(--muted)}.role-badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#ece7ff;color:var(--primary);font-size:12px;font-weight:900}
.logout{border:0;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 5px 15px rgba(44,34,90,.08)}
.hero{background:linear-gradient(135deg,#6d4aff,#9b6eff 55%,#c088ff);border-radius:28px;padding:20px;color:#fff;box-shadow:0 18px 40px rgba(109,74,255,.26);position:relative;overflow:hidden}
.hero:after{content:"⭐";position:absolute;right:-8px;top:-18px;font-size:100px;opacity:.13;transform:rotate(18deg)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h2{font-size:22px;margin-bottom:5px}.hero p{opacity:.88;margin:0}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;flex:0 0 auto}
.ring:before{content:"";width:70px;height:70px;border-radius:50%;background:#7650f2;position:absolute}.ring b{position:relative;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-radius:17px;padding:11px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;opacity:.9}
.card{background:var(--card);border:1px solid rgba(235,231,246,.85);border-radius:24px;padding:17px;box-shadow:0 10px 30px rgba(58,45,110,.08);margin-top:14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card-title h2{font-size:18px;margin:0}.card-title span{font-size:13px;color:var(--muted)}
.reward{display:flex;align-items:center;gap:14px}.gift{width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:#fff4cd;font-size:34px;flex:0 0 auto}.reward-main{flex:1}.reward-main h3{margin:0 0 4px;font-size:17px}.bar{height:11px;border-radius:999px;background:#eeeaf7;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb82f,#ff7e45);border-radius:999px;width:0}
.missions{display:grid;gap:10px}.mission{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:19px;background:#fff}.mission.done{background:#f0fff7;border-color:#bcebd2}.mission.waiting{background:#fffaf0;border-color:#f4daa0}.mission-emoji{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#f3efff;font-size:26px;flex:0 0 auto}.mission-info{flex:1;min-width:0}.mission-info h3{font-size:15px;margin:0 0 3px}.mission-info p{font-size:12px;color:var(--muted);margin:0}.points{font-size:12px;font-weight:900;color:#8b65ee}.mission button{border:0;min-width:48px;height:48px;border-radius:16px;background:#ede7ff;color:var(--primary);font-size:22px;font-weight:900}.mission.done button{background:#26b873;color:#fff}.mission.waiting button{background:#ffbd3b;color:#fff}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}.empty .big{font-size:48px;margin-bottom:8px}
.nav{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid #ece8f6;box-shadow:0 12px 35px rgba(46,34,95,.18);border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav.child{grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;border-radius:16px;padding:9px 3px;color:#80798e;font-size:11px;font-weight:800}.nav button b{display:block;font-size:21px;margin-bottom:2px}.nav button.active{background:#efeaff;color:var(--primary)}
.section{display:none}.section.active{display:block}
.calendar-head{display:flex;align-items:center;justify-content:space-between}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 0}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.weekday{font-size:11px;color:var(--muted);font-weight:800;padding:4px}.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#f6f4fa;font-weight:800;font-size:13px}.day small{font-size:9px}.day.complete{background:#ddf8e9;color:#168657}.day.partial{background:#fff1c7;color:#9a6a00}.day.missed{background:#ffe5e9;color:#c24454}.day.future{opacity:.35}.day.today{outline:3px solid #b7a7ff}
.achievement-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.achievement{border-radius:20px;padding:16px;background:#fff;border:1px solid var(--line);min-height:120px}.achievement.locked{filter:grayscale(1);opacity:.48}.achievement .medal{font-size:33px;margin-bottom:8px}.achievement h3{font-size:14px;margin:0 0 4px}.achievement p{font-size:12px;color:var(--muted);margin:0}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:13px;font-weight:800;color:var(--muted)}.tabs button.active{background:#eee8ff;color:var(--primary);border-color:#d9ceff}
.admin-panel{display:none}.admin-panel.active{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays label{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:11px;font-weight:800;background:#fff}.weekdays input{margin:0 0 5px}
.task-admin{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.task-admin:last-child{border-bottom:0}.task-admin .mission-emoji{width:42px;height:42px}.task-admin .grow{flex:1}.task-admin h3{font-size:14px;margin:0}.task-admin p{font-size:11px;color:var(--muted);margin:3px 0 0}
.pending{padding:11px;border:1px solid #f3ddb0;background:#fffaf0;border-radius:16px;margin:8px 0;display:flex;gap:10px;align-items:center}.pending .grow{flex:1}.pending button{border:0;border-radius:12px;padding:9px 11px;background:#26b873;color:#fff;font-weight:800}
.toast{position:fixed;z-index:100;left:50%;top:max(18px,env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;background:#2c273d;color:#fff;padding:11px 16px;border-radius:999px;font-weight:800;box-shadow:0 9px 25px rgba(0,0,0,.18);transition:.25s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
.loader{position:fixed;inset:0;background:rgba(247,245,255,.78);backdrop-filter:blur(5px);z-index:90;display:none;place-items:center}.loader.show{display:grid}.spinner{width:46px;height:46px;border:5px solid #dfd8f4;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.confetti{position:fixed;top:-20px;z-index:120;font-size:22px;animation:fall 1.8s linear forwards;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
@media(max-width:440px){.shell{padding-left:12px;padding-right:12px}.hero{padding:17px}.stats{gap:6px}.stat{padding:9px 5px}.achievement-grid{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
body{background:radial-gradient(circle at 15% 0,#f7d7ff 0,transparent 30%),radial-gradient(circle at 90% 10%,#fff0b7 0,transparent 28%),linear-gradient(180deg,#f4e9ff,#fff7fd 58%,#fff)}.login{border:3px solid #fff;box-shadow:0 18px 45px rgba(86,26,151,.2);position:relative;overflow:hidden}.login:before{content:"⭐";position:absolute;left:18px;top:18px;font-size:30px}.login:after{content:"💜";position:absolute;right:18px;top:20px;font-size:30px}.logo-bubble,.avatar{overflow:hidden;padding:0;background:#4a176f;border:3px solid #fff;transform:none}.logo-bubble img,.avatar img{width:100%;height:100%;object-fit:cover}.primary{background:linear-gradient(135deg,#6d22d8,#b93cff 55%,#ff4ca3)}.hero{background:linear-gradient(135deg,#4b1677,#7427c9 55%,#b437e9);border:3px solid rgba(255,255,255,.7)}.card{border:2px solid #f0e4ff}.mission:nth-child(3n+1) .mission-emoji{background:#f1e6ff}.mission:nth-child(3n+2) .mission-emoji{background:#fff1c9}.mission:nth-child(3n) .mission-emoji{background:#ffe3f2}

<body>
<div id="startupSplash" class="startup-splash"><div class="startup-inner"><div class="splash-stars">⭐ ✨ ⭐</div><img src="./app-icon.jpg" alt="Missões Divertidas"><h1>Missões <span>Divertidas</span></h1><p>Tarefas, estrelas e recompensas!</p></div></div>
<div id="root"></div><div id="toast" class="toast"></div><div id="loader" class="loader"><div class="spinner"></div></div>
<script>
const API="/api/family";
const ADMIN="/api/admin";
const PLATFORM_ADMIN="/api/platform-admin";
let session=localStorage.getItem("md_session")||"";
let loginRole=localStorage.getItem("md_role")||"child";
let data=null, adminData=null, platformData=null, activeSection="home", adminTab="family", editingTask=null, selectedDate=null;
let pullStartY=0,pullDistance=0,pullRefreshing=false,pullBound=false;
let liveSyncTimer=null,lastSyncFingerprint="",lastPendingCount=0;
const root=document.getElementById("root");
const avatarStorageKey=role=>"md_avatar_"+role;
function getLocalAvatar(role){try{return localStorage.getItem(avatarStorageKey(role))||""}catch{return""}}
function saveLocalAvatar(role,dataUrl){try{if(dataUrl)localStorage.setItem(avatarStorageKey(role),dataUrl);else localStorage.removeItem(avatarStorageKey(role))}catch{}}
function profileAvatarHtml(role,fallback){
  const src=(data&&data.profileAvatar)||getLocalAvatar(role);
  return src?'<img src="'+src+'" alt="Foto de perfil">':fallback;
}
async function compressAvatarDataUrl(src,size=256){
  const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
  const c=document.createElement("canvas");c.width=size;c.height=size;const ctx=c.getContext("2d");
  const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
  ctx.drawImage(img,sx,sy,s,s,0,0,size,size);return c.toDataURL("image/jpeg",.84);
}
async function createPersonalizedAvatar(){
  if(data.role!=="child"){toast("O avatar personalizado é da criança.");return}
  const photo=data.profileAvatar||getLocalAvatar("child");
  if(!photo){toast("Primeiro escolha uma foto da criança na galeria.");document.getElementById("profilePhotoInput")?.click();return}
  if(!confirm("Criar um avatar personalizado usando a foto atual da criança?"))return;
  showLoader(true);
  try{
    toast("Criando seu avatar mágico… ✨");
    const r=await fetch("/api/generate-avatar",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({photo,name:data.family.child_name||"Criança"})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.avatar)throw new Error(j.error||"Não foi possível criar o avatar.");
    const avatar=await compressAvatarDataUrl(j.avatar,256);
    saveLocalAvatar("child",avatar);
    data=await callApi("update_avatar",{avatar});
    toast("Seu avatar personalizado ficou pronto! 🎨✨");renderApp();
  }catch(e){toast(e.message||"Não foi possível criar o avatar.")}
  finally{showLoader(false)}
}
async function openAvatarCropper(file,role){
  if(!file||!file.type.startsWith("image/"))throw new Error("Escolha uma imagem.");
  const img=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
  const wrap=document.createElement("div");
  wrap.className="crop-modal";
  wrap.innerHTML=`<div class="crop-sheet">
    <div class="crop-head"><h3>Enquadrar foto</h3><button id="cropClose">×</button></div>
    <p>Arraste a foto e use o controle para aproximar.</p>
    <div class="crop-stage"><canvas id="cropCanvas" width="320" height="320"></canvas><div class="crop-ring"></div></div>
    <label class="crop-zoom">Zoom <input id="cropZoom" type="range" min="1" max="3" value="1" step="0.01"></label>
    <div class="crop-actions"><button class="secondary" id="cropCancel">Cancelar</button><button class="primary" id="cropSave">Usar esta foto</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const canvas=wrap.querySelector("#cropCanvas"),ctx=canvas.getContext("2d"),zoom=wrap.querySelector("#cropZoom");
  let scale=Math.max(canvas.width/img.width,canvas.height/img.height),z=1;
  let x=(canvas.width-img.width*scale)/2,y=(canvas.height-img.height*scale)/2;
  let dragging=false,lastX=0,lastY=0;
  const clamp=()=>{
    const w=img.width*scale*z,h=img.height*scale*z;
    if(w<=canvas.width)x=(canvas.width-w)/2;else x=Math.min(0,Math.max(canvas.width-w,x));
    if(h<=canvas.height)y=(canvas.height-h)/2;else y=Math.min(0,Math.max(canvas.height-h,y));
  };
  const draw=()=>{clamp();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,x,y,img.width*scale*z,img.height*scale*z)};
  const setZoom=v=>{const old=z;z=Number(v);const cx=canvas.width/2,cy=canvas.height/2;x=cx-(cx-x)*(z/old);y=cy-(cy-y)*(z/old);draw()};
  zoom.oninput=()=>setZoom(zoom.value);
  const pos=e=>{const p=e.touches?e.touches[0]:e;return{x:p.clientX,y:p.clientY}};
  const down=e=>{dragging=true;const p=pos(e);lastX=p.x;lastY=p.y;e.preventDefault()};
  const move=e=>{if(!dragging)return;const p=pos(e);x+=p.x-lastX;y+=p.y-lastY;lastX=p.x;lastY=p.y;draw();e.preventDefault()};
  const up=()=>dragging=false;
  canvas.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  canvas.addEventListener("touchstart",down,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});canvas.addEventListener("touchend",up);
  const close=()=>wrap.remove();
  wrap.querySelector("#cropClose").onclick=close;wrap.querySelector("#cropCancel").onclick=close;
  wrap.querySelector("#cropSave").onclick=async()=>{
    const out=document.createElement("canvas");out.width=256;out.height=256;
    out.getContext("2d").drawImage(canvas,0,0,320,320,0,0,256,256);
    const avatar=out.toDataURL("image/jpeg",.84);
    showLoader(true);
    try{
      saveLocalAvatar(role,avatar);
      data=await callApi("update_avatar",{avatar});
      close();toast("Foto sincronizada em todos os aparelhos 📸");renderApp();
    }catch(e){toast(e.message||"Não foi possível salvar a foto.")}
    finally{showLoader(false)}
  };
  draw();
}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const showLoader=v=>document.getElementById("loader").classList.toggle("show",!!v);
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
async function callPlatform(action,payload={}){
  const headers={"content-type":"application/json"};if(session)headers["x-family-session"]=session;
  const r=await fetch(PLATFORM_ADMIN,{method:"POST",headers,body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({error:"Erro de conexão."}));if(!r.ok)throw new Error(j.error||"Não foi possível concluir.");return j;
}
function monthlyStarEconomy(tasks,ym){
  const [y,m]=ym.split("-").map(Number),days=new Date(y,m,0).getDate();let taskMax=0;
  for(let day=1;day<=days;day++){const wd=new Date(Date.UTC(y,m-1,day,12)).getUTCDay();for(const t of tasks||[]){if((t.task_schedules||[]).some(s=>Number(s.weekday)===wd))taskMax+=Number(t.points||0)}}
  const bonuses=[3,7,14,30].filter(x=>x<=days).reduce((s,x)=>s+Number(data?.streakBonuses?.[x]||0),0);
  const total=taskMax+bonuses;return{days,taskMax,bonuses,total,daily:Math.round(total/days),week:Math.round(total/days*7)};
}
async function callApi(action,payload={}){
  const headers={"content-type":"application/json"}; if(session) headers["x-family-session"]=session;
  const r=await fetch(API,{method:"POST",headers,body:JSON.stringify({action,...payload})});
  const j=await r.json().catch(()=>({error:"Erro de conexão."}));
  if(r.status===401 && action!=="login"){logout(false);throw new Error("Sessão expirada.");}
  if(!r.ok) throw new Error(j.error||"Não foi possível concluir.");
  return j;
}
async function callAdmin(){
  const r=await fetch(ADMIN,{method:"POST",headers:{"content-type":"application/json","x-family-session":session},body:"{}"});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||"Erro."); return j;
}
function renderLogin(error=""){
  root.innerHTML=`<div class="login-shell"><div class="login">
    <div class="logo-bubble"><img src="./app-icon.jpg" alt="Missões Divertidas"></div><h1>Missões Divertidas</h1>
    <p class="subtitle">Transforme as tarefas do dia em um jogo cheio de estrelas, conquistas e recompensas!</p>
    <div class="field"><label>Usuário</label><input id="username" autocomplete="username" autocapitalize="none" placeholder="Seu usuário"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
    <button class="primary" id="loginBtn">Entrar no jogo 🚀</button><button class="secondary" id="createBtn" style="width:100%;margin-top:10px">✨ Criar minha conta</button>
    <div class="error" id="loginError" style="${error?"display:block":""}">${esc(error)}</div>
    <p class="small" style="text-align:center;margin:18px 0 0">No celular, depois de entrar, use <b>Adicionar à Tela de Início</b> para abrir como um app.</p>
  </div></div>`;
  document.getElementById("loginBtn").onclick=doLogin;document.getElementById("createBtn").onclick=()=>window.MissoesRegister.render();
}

async function refreshAppFromPull(){

function resetPullIndicator(){
  pullDistance=0;
  const ind=document.getElementById("pullRefresh");
  if(ind){ind.style.transform="translate(-50%,-72px)";ind.classList.remove("ready","refreshing");const s=ind.querySelector("span");if(s)s.textContent="Puxe para atualizar";}
}
function bindPullToRefresh(){
  if(pullBound)return;
  pullBound=true;
  document.addEventListener("touchstart",e=>{
    if(window.scrollY<=0 && e.touches && e.touches.length===1) pullStartY=e.touches[0].clientY; else pullStartY=0;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!pullStartY||pullRefreshing||window.scrollY>0||!e.touches||!e.touches.length)return;
    pullDistance=Math.max(0,Math.min(120,e.touches[0].clientY-pullStartY));
    const ind=document.getElementById("pullRefresh"); if(!ind)return;
    ind.style.transform="translate(-50%,"+(-72+Math.min(72,pullDistance*.72))+"px)";
    ind.classList.toggle("ready",pullDistance>=78);
    const s=ind.querySelector("span");if(s)s.textContent=pullDistance>=78?"Solte para atualizar":"Puxe para atualizar";
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(!pullStartY)return;
    const doRefresh=pullDistance>=78;
    pullStartY=0;
    if(doRefresh) refreshAppFromPull(); else resetPullIndicator();
  },{passive:true});
}

let avatarSpriteDataUrl="",avatarSpritePromise=null;
async function ensureAvatarSprite(){
  if(avatarSpriteDataUrl)return avatarSpriteDataUrl;
  if(avatarSpritePromise)return avatarSpritePromise;
  avatarSpritePromise=(async()=>{
    const parts=await Promise.all([0,1,2,3,4,5].map(i=>fetch("./assets/avatars/sprite-0"+i+".txt",{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error("avatar");return r.text()})));
    avatarSpriteDataUrl="data:image/webp;base64,"+parts.join("").replace(/\s+/g,"");
    return avatarSpriteDataUrl;
  })().catch(()=>{avatarSpritePromise=null;return""});
  return avatarSpritePromise;
}

function avatarPoseInfo(character,style){
  const c=character==="ryan"?"ryan":"duda";

    if(["focus"].includes(style))return{col:1,row:0,name:"Duda estudando"};
    if(["proud","hero","target"].includes(style))return{col:2,row:0,name:"Duda missão concluída"};
    if(["king","cool"].includes(style))return{col:3,row:0,name:"Duda campeã"};

  }

function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
  const words=String(text).split(" ");let line="",yy=y;

}

    if(isParent){
      try{
        const pr=await callApi("pending_rewards");
        const box=document.getElementById("rewardRequests");
        if(box){
          const reqs=pr.items||[];
          box.innerHTML=reqs.length?`<div class="card"><div class="card-title"><h2>⏳ Pedidos de recompensa</h2><span>${reqs.length}</span></div>${reqs.map(q=>`<div class="pending"><div style="font-size:28px">${esc(q.reward_store?.emoji||"🎁")}</div><div class="grow"><b>${esc(q.reward_store?.title||"Recompensa")}</b><div class="small">⭐ ${q.cost} • aguardando decisão</div></div><button class="secondary" data-reward-decision="approved" data-reward-id="${q.id}">Aprovar</button><button class="danger" data-reward-decision="rejected" data-reward-id="${q.id}">×</button></div>`).join("")}</div>`:"";
          box.querySelectorAll("[data-reward-decision]").forEach(btn=>btn.onclick=async()=>{showLoader(true);try{await callApi("decide_reward",{redemption_id:btn.dataset.rewardId,status:btn.dataset.rewardDecision});toast(btn.dataset.rewardDecision==="approved"?"Recompensa aprovada 🎁":"Pedido recusado.");renderStore()}catch(e){toast(e.message)}finally{showLoader(false)}});
        }
      }catch{}
      document.querySelectorAll("[data-edit-reward]").forEach(btn=>btn.onclick=async()=>{const title=prompt("Nome da recompensa:",btn.dataset.title);if(title===null)return;const cost=Number(prompt("Custo em estrelas:",btn.dataset.cost));if(!title.trim()||!cost)return;showLoader(true);try{await callApi("save_reward",{id:btn.dataset.editReward,title:title.trim(),cost,emoji:btn.dataset.emoji});toast("Recompensa atualizada ✅");renderStore()}catch(e){toast(e.message)}finally{showLoader(false)}});
      document.querySelectorAll("[data-delete-reward]").forEach(btn=>btn.onclick=async()=>{if(!confirm("Remover esta recompensa da loja?"))return;showLoader(true);try{await callApi("delete_reward",{id:btn.dataset.deleteReward});toast("Recompensa removida.");renderStore()}catch(e){toast(e.message)}finally{showLoader(false)}});
      const add=document.getElementById("addReward");
      if(add)add.onclick=async()=>{
        const title=document.getElementById("rewardTitle").value.trim();
        const cost=Number(document.getElementById("rewardCost").value);
        const emoji=document.getElementById("rewardEmoji").value||"🎁";
        if(!title){toast("Informe o nome da recompensa.");return}
        showLoader(true);
        try{await callApi("save_reward",{title,cost,emoji});toast("Recompensa adicionada 🎁");renderStore()}
        catch(e){toast(e.message)}
        finally{showLoader(false)}
      };
    }else{
      el.querySelectorAll("[data-redeem]").forEach(b=>b.onclick=async()=>{
        if(!confirm("Solicitar esta recompensa?"))return;
        try{await callApi("redeem_reward",{reward_id:b.dataset.redeem});toast("Pedido enviado! 🎁");renderStore()}
        catch(e){toast(e.message)}
      });
    }
  }catch(e){el.innerHTML=`<div class="card"><div class="empty">${esc(e.message)}</div></div>`}
}
function renderParent(){
  const el=document.getElementById("sec-parent"),f=data.family;
  el.innerHTML=`<div class="tabs"><button data-at="family" class="${adminTab==="family"?"active":""}">👨‍👩‍👧 Família</button><button data-at="tasks" class="${adminTab==="tasks"?"active":""}">🎯 Tarefas</button><button data-at="access" class="${adminTab==="access"?"active":""}">🔐 Acesso</button><button data-at="pending" class="${adminTab==="pending"?"active":""}">✅ Confirmações ${adminData?.pending?.length?"("+adminData.pending.length+")":""}</button></div>
  <div id="ap-family" class="admin-panel ${adminTab==="family"?"active":""}"></div>
  <div id="ap-tasks" class="admin-panel ${adminTab==="tasks"?"active":""}"></div>

  <div id="ap-pending" class="admin-panel ${adminTab==="pending"?"active":""}"></div>`;
  el.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.at;renderParent()});
  const eco=monthlyStarEconomy(adminData?.tasks||[],data.today.slice(0,7));
  document.getElementById("ap-family").innerHTML=`<div class="card"><div class="card-title"><h2>👨‍👩‍👧 Configurações da família</h2></div>
    <div class="field"><label>Nome da família / perfil</label><input id="famName" value="${esc(f.display_name)}"></div>
    <div class="card-title" style="margin-top:18px"><h2>👧👦 Crianças</h2><span>${(adminData?.accounts||[]).filter(a=>a.role==="child").length}</span></div>
    <div id="childrenList">${(adminData?.accounts||[]).filter(a=>a.role==="child").map(c=>`<button class="secondary child-select" data-child="${c.id}" style="width:100%;margin-bottom:8px;text-align:left">${c.avatar_key?'<span>🖼️</span>':'<span>⭐</span>'} <b>${esc(c.display_name)}</b> <span class="small">@${esc(c.username)}</span>${data.childAccountId===c.id?' • selecionada':""}</button>`).join("")}</div>
    <div class="card" style="background:#faf8ff"><div class="card-title"><h2>➕ Adicionar criança</h2></div>
      <div class="field"><label>Nome</label><input id="newChildName" placeholder="Nome da criança"></div>
      <div class="row2"><div class="field"><label>Usuário</label><input id="newChildUser" autocapitalize="none" placeholder="Ex.: teste"></div><div class="field"><label>Senha</label><input id="newChildPass" type="password" placeholder="4+ caracteres"></div></div>
      <button class="secondary" id="createChildBtn" style="width:100%">Criar nova criança</button>
    </div>
    <div class="row2"><div class="field"><label>Nome da criança</label><input id="childName" value="${esc(f.child_name)}"></div><div class="field"><label>Nome do responsável</label><input id="parentName" value="${esc(f.parent_name||"")}"></div></div>
    <div class="field"><label>Presente / recompensa</label><input id="rewardName" value="${esc(f.current_reward_name||"")}"></div>
    <div class="field"><label>Meta do mês (%)</label><input id="goalPct" type="number" min="1" max="100" value="${f.reward_goal_percent}"></div>
    <button class="primary" id="saveFamily">Salvar alterações</button></div><div class="card"><div class="card-title"><h2>⭐ Economia de estrelas</h2><span>Máximo do mês</span></div><div class="stats" style="color:#fff;background:linear-gradient(135deg,#6d4aff,#9c73ff);padding:10px;border-radius:17px"><div class="stat"><b>${eco.total} ⭐</b><span>máximo mensal</span></div><div class="stat"><b>${eco.week} ⭐</b><span>média semanal</span></div><div class="stat"><b>${eco.daily} ⭐</b><span>média diária</span></div></div><p class="small" style="margin-top:12px">Missões: ${eco.taskMax} ⭐ • bônus máximos: ${eco.bonuses} ⭐. Sugestão de loja: pequenas ${Math.round(eco.total*.05)}–${Math.round(eco.total*.10)} ⭐ • médias ${Math.round(eco.total*.15)}–${Math.round(eco.total*.30)} ⭐ • especiais ${Math.round(eco.total*.40)}–${Math.round(eco.total*.70)} ⭐.</p></div>`;
  document.querySelectorAll(".child-select").forEach(b=>b.onclick=async()=>{showLoader(true);try{data=await callApi("select_child",{child_account_id:b.dataset.child});toast("Perfil de "+(data.childDisplayName||"criança")+" selecionado.");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}});
  const createChildBtn=document.getElementById("createChildBtn");if(createChildBtn)createChildBtn.onclick=async()=>{const name=document.getElementById("newChildName").value.trim(),username=document.getElementById("newChildUser").value.trim(),password=document.getElementById("newChildPass").value;if(!name||!username||password.length<4){toast("Preencha nome, usuário e senha.");return}showLoader(true);try{const r=await callApi("create_child",{name,username,password});adminData=await callAdmin();data=await callApi("select_child",{child_account_id:r.child.id});toast("Criança criada sem alterar os dados existentes ✅");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}};
  document.getElementById("saveFamily").onclick=async()=>{showLoader(true);try{data=await callApi("save_family",{display_name:document.getElementById("famName").value,child_name:document.getElementById("childName").value,parent_name:document.getElementById("parentName").value,current_reward_name:document.getElementById("rewardName").value,reward_goal_percent:Number(document.getElementById("goalPct").value)});toast("Configurações salvas ✅");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}};
  renderTaskAdmin();
  document.getElementById("ap-access").innerHTML=`<div class="card"><div class="card-title"><h2>🔐 Usuários e senhas</h2></div><div class="row2"><div class="field"><label>Usuário da criança</label><input id="childUser" value="${esc((adminData?.accounts||[]).find(a=>a.role==='child')?.username||'')}"></div><div class="field"><label>Nova senha</label><input id="childPass" type="password" placeholder="Em branco mantém a atual"></div></div><button class="secondary" style="width:100%;margin-bottom:14px" id="saveChildAccess">Salvar acesso da criança</button><div class="row2"><div class="field"><label>Usuário do responsável</label><input id="parentUser" value="${esc((adminData?.accounts||[]).find(a=>a.role==='parent')?.username||'')}"></div><div class="field"><label>Nova senha</label><input id="parentPass" type="password" placeholder="Em branco mantém a atual"></div></div><button class="primary" id="saveParentAccess">Salvar acesso do responsável</button>
    <div class="card-title" style="margin-top:20px"><h2>🔢 PIN da área dos pais</h2><span>${adminData?.parent_pin_configured?"Ativo":"Não configurado"}</span></div>
    <div class="field"><label>Novo PIN (4 a 8 números)</label><input id="parentPin" inputmode="numeric" maxlength="8" placeholder="Ex.: 2580"></div>
    <button class="secondary" id="saveParentPin" style="width:100%">Salvar PIN</button></div>`;
  document.getElementById("saveParentPin").onclick=async()=>{const pin=document.getElementById("parentPin").value.trim();if(!/^\d{4,8}$/.test(pin)){toast("O PIN deve ter de 4 a 8 números.");return}showLoader(true);try{await callApi("update_access",{parent_pin:pin});adminData=await callAdmin();data.parentPinConfigured=true;toast("PIN da área dos pais atualizado 🔐");renderParent()}catch(e){toast(e.message)}finally{showLoader(false)}};
  document.getElementById("saveChildAccess").onclick=async()=>{showLoader(true);try{await callApi("update_credentials",{account_role:"child",username:document.getElementById("childUser").value,password:document.getElementById("childPass").value});adminData=await callAdmin();toast("Acesso da criança atualizado 🔐");renderParent()}catch(e){toast(e.message)}finally{showLoader(false)}};document.getElementById("saveParentAccess").onclick=async()=>{showLoader(true);try{await callApi("update_credentials",{account_role:"parent",username:document.getElementById("parentUser").value,password:document.getElementById("parentPass").value});adminData=await callAdmin();toast("Acesso do responsável atualizado 🔐");renderParent()}catch(e){toast(e.message)}finally{showLoader(false)}};
  const pending=adminData?.pending||[],todayPending=pending.filter(p=>p.due_date===data.today);
  document.getElementById("ap-pending").innerHTML=`<div class="card"><div class="card-title"><h2>✅ Aprovar missões</h2><span>${pending.length} aguardando</span></div>${todayPending.length?`<button class="primary" id="approveAllToday" style="margin-bottom:12px">✅ Aprovar todas de hoje (${todayPending.length})</button>`:""}${pending.length?pending.map(p=>`<div class="pending"><div style="font-size:26px">${esc(p.tasks?.emoji||"⭐")}</div><div class="grow"><b>${esc(p.tasks?.title||"Missão")}</b><div class="small">${esc(p.due_date)} • +${p.tasks?.points||0} estrelas</div></div><button data-approve="${p.id}">Aprovar</button></div>`).join(""):`<div class="empty"><div class="big">👌</div>Nenhuma missão aguardando confirmação.</div>`}</div>`;
  const approveAllBtn=document.getElementById("approveAllToday");if(approveAllBtn)approveAllBtn.onclick=async()=>{if(!confirm(`Aprovar as ${todayPending.length} missões de hoje?`))return;showLoader(true);try{data=await callApi("approve_all",{due_date:data.today});adminData=await callAdmin();toast("Missões de hoje aprovadas ⭐");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}};
  document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{showLoader(true);try{data=await callApi("approve_completion",{completion_id:b.dataset.approve});adminData=await callAdmin();toast("Missão aprovada ⭐");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}});
}
function renderTaskAdmin(){
  const el=document.getElementById("ap-tasks"),tasks=adminData?.tasks||[],t=editingTask;
  const selected=t?(t.task_schedules||[]).map(x=>Number(x.weekday)):[0,1,2,3,4,5,6];
  const names=["D","S","T","Q","Q","S","S"];
  const icons=["⭐","🛏️","🧹","🧺","👕","🧸","🪥","🛁","🚿","📚","✏️","🎒","📝","🐶","🐱","🐾","💧","🥣","🍽️","🥗","🤝","❤️","🌟","🏆","🎯","🕒","🌞","🌙","🧽","🗑️","🪴","⚽","🎨","🎵"];
  el.innerHTML=`<div class="card"><div class="card-title"><h2>${t?"✏️ Editar missão":"➕ Nova missão"}</h2>${t?'<button class="secondary" id="cancelEdit">Cancelar</button>':""}</div>
    <div class="field"><label>Nome da missão</label><input id="taskTitle" value="${esc(t?.title||"")}" placeholder="Ex.: Guardar os brinquedos"></div>
    <div class="field"><label>Descrição opcional</label><input id="taskDesc" value="${esc(t?.description||"")}" placeholder="Uma dica curta"></div>

    <div class="field"><label>Escolha um ícone</label>
      <div class="icon-picker">${icons.map(ic=>`<button type="button" class="icon-choice ${(t?.emoji||"⭐")===ic?"active":""}" data-icon="${ic}">${ic}</button>`).join("")}</div>
      <input id="taskEmoji" maxlength="8" value="${esc(t?.emoji||"⭐")}" placeholder="Ou digite outro emoji">
    </div>

    <div class="row2"><div class="field"><label>Pontos</label><input id="taskPoints" type="number" min="0" value="${t?.points||10}"></div>
      <div class="field"><label>Importância</label><label class="priority-toggle"><input id="taskPriority" type="checkbox" ${t?.is_priority?"checked":""}><span>⭐ Tarefa prioritária</span></label></div>
    </div>

    <div class="row2">
      <div class="field"><label>Categoria</label><select id="taskCategory"><option>Casa</option><option>Organização</option><option>Estudos</option><option>Higiene</option><option>Pets</option><option>Alimentação</option><option>Comportamento</option><option>Outros</option></select></div>
      <div class="field"><label>Período</label><select id="taskPeriod"><option value="any">Qualquer horário</option><option value="morning">Manhã</option><option value="afternoon">Tarde</option><option value="evening">Noite</option></select></div>
    </div>
    <div class="field"><label>Horário opcional</label><input id="taskTime" type="time" value="${esc((t?.due_time||"").slice(0,5))}"></div>
    <div class="field"><label>Recorrência</label><div class="recurrence-row">
      <button type="button" class="secondary recurrence-btn" data-days="0,1,2,3,4,5,6">Todos os dias</button>
      <button type="button" class="secondary recurrence-btn" data-days="1,2,3,4,5">Seg–Sex</button>
      <button type="button" class="secondary recurrence-btn" data-days="0,6">Fim de semana</button>
    </div></div>

    <div class="field"><label>Dias da semana</label><div class="weekdays">${names.map((n,i)=>`<label><input type="checkbox" data-wd="${i}" ${selected.includes(i)?"checked":""}>${n}</label>`).join("")}</div></div>

    <div class="task-tip">💡 Para uma rotina simples, use <b>Todos os dias</b>. A criança verá automaticamente a missão em cada dia escolhido.</div>
    <button class="primary" id="saveTask">${t?"Salvar missão":"Criar missão"}</button>
  </div>
  <div class="card"><div class="card-title"><h2>📋 Missões cadastradas</h2><span>${tasks.length}</span></div>
    ${tasks.map(x=>`<div class="task-admin ${x.is_priority?"task-priority-row":""}"><div class="mission-emoji">${esc(x.emoji)}</div><div class="grow"><h3>${esc(x.title)} ${x.is_priority?'<span class="priority-badge">⭐ Prioritária</span>':""}</h3><p>${x.points} estrelas • ${esc(x.category||"Casa")} • ${x.period==="morning"?"Manhã":x.period==="afternoon"?"Tarde":x.period==="evening"?"Noite":"Qualquer horário"} • ${(x.task_schedules||[]).length} dia(s)</p></div><button class="secondary" data-edit="${x.id}">Editar</button><button class="danger" data-del="${x.id}">×</button></div>`).join("")||'<div class="empty">Nenhuma missão cadastrada.</div>'}
  </div>`;
  const cat=document.getElementById("taskCategory"),per=document.getElementById("taskPeriod");if(cat)cat.value=t?.category||"Casa";if(per)per.value=t?.period||"any";
  if(t)document.getElementById("cancelEdit").onclick=()=>{editingTask=null;renderTaskAdmin()};
  el.querySelectorAll("[data-icon]").forEach(b=>b.onclick=()=>{document.getElementById("taskEmoji").value=b.dataset.icon;el.querySelectorAll("[data-icon]").forEach(x=>x.classList.toggle("active",x===b))});
  el.querySelectorAll(".recurrence-btn").forEach(b=>b.onclick=()=>{const set=new Set(b.dataset.days.split(",").map(Number));document.querySelectorAll("[data-wd]").forEach(x=>x.checked=set.has(Number(x.dataset.wd)))});
  document.getElementById("saveTask").onclick=async()=>{
    const weekdays=[...document.querySelectorAll("[data-wd]:checked")].map(x=>Number(x.dataset.wd));
    if(!weekdays.length){toast("Escolha pelo menos um dia da semana.");return}
    showLoader(true);try{
      data=await callApi("save_task",{id:t?.id||null,emoji:document.getElementById("taskEmoji").value,title:document.getElementById("taskTitle").value,description:document.getElementById("taskDesc").value,points:Number(document.getElementById("taskPoints").value),weekdays,is_priority:document.getElementById("taskPriority").checked,category:document.getElementById("taskCategory").value,period:document.getElementById("taskPeriod").value,due_time:document.getElementById("taskTime").value||null,requires_parent_confirmation:true});
      adminData=await callAdmin();editingTask=null;toast(t?"Missão atualizada ✅":"Missão criada 🎯");renderApp();
    }catch(e){toast(e.message)}finally{showLoader(false)}
  };
  el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editingTask=tasks.find(x=>x.id===b.dataset.edit);renderTaskAdmin();window.scrollTo({top:0,behavior:"smooth"})});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Remover esta missão?"))return;showLoader(true);try{data=await callApi("delete_task",{task_id:b.dataset.del});adminData=await callAdmin();toast("Missão removida.");renderApp()}catch(e){toast(e.message)}finally{showLoader(false)}});
}
function confetti(){const chars=["⭐","🎉","✨","💜","🏆"];for(let i=0;i<28;i++){const x=document.createElement("span");x.className="confetti";x.textContent=chars[Math.floor(Math.random()*chars.length)];x.style.left=Math.random()*100+"vw";x.style.animationDelay=(Math.random()*.6)+"s";x.style.animationDuration=(1.3+Math.random()*1.2)+"s";document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}}
(async()=>{if(session)await loadDashboard();else renderLogin();setTimeout(()=>document.getElementById("startupSplash")?.classList.add("hide"),900)})();
</script>
</body></html>
